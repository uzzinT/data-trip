<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데이터 여행사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 여행사 책상 위 지도 느낌의 단일 밝은 테마 */
:root{
  --bg:#f5efe4; --panel:#fffcf6; --panel-2:#f3ecdf; --line:#e0d4bf;
  --text:#2a241c; --muted:#6e6252;
  --accent:#c9502a; --sight:#2f6fb8; --food:#c9502a; --ok:#2a8a57; --alert:#c93a32; --warn:#9a6412; --rumor:#7a4fc4;
  --f-display:'Do Hyeon','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 48px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:26px} h3{font-size:20px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,canvas:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:700}
.btn{border:0;border-radius:10px;padding:10px 18px;background:var(--accent);color:#fff;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.small{padding:6px 12px;font-size:14px}
.btn.danger{background:var(--alert)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;min-width:0}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:13px;background:var(--panel-2);white-space:nowrap}
.chip.sight{border-color:var(--sight);color:var(--sight)}
.chip.food{border-color:var(--food);color:var(--food)}
.chip.bad{border-color:var(--alert);color:var(--alert)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* 처음 화면 */
.title{text-align:center;justify-items:center;padding:clamp(22px,5vw,48px);
  background:radial-gradient(circle at 20% 10%,#fde3cf,transparent 50%),radial-gradient(circle at 85% 90%,#d5e6f5,transparent 55%),var(--panel)}
.title .kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.3em;color:var(--sight)}
.title h1{font-size:clamp(44px,9vw,80px);line-height:1}
.title h1 em{font-style:normal;color:var(--accent)}
.title input{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:min(300px,100%);text-align:center}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:820px}
.steps4 div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;color:var(--muted);text-align:left}
.steps4 b{display:block;color:var(--text);font-size:15px}
@media (max-width:640px){.steps4{grid-template-columns:repeat(2,1fr)}}

/* 나래 대사 */
.talk{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.face{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:#dbe9f7;border:2px solid var(--sight)}
.bubble{background:#fff;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 14px}
.bubble .who{font-size:12px;font-weight:700;color:var(--sight)}
.tip{border-left:4px solid var(--sight);background:#eef4fb;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;min-height:2.6em}
/* 타자 중 깜박이는 커서 */
.typing span::after{content:'▌';color:var(--sight);animation:blink .8s steps(1) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.tip.warn{border-color:var(--alert);background:#fbeceb}

/* 계획 화면 */
.client{grid-template-columns:auto 1fr;align-items:start}
.client .avatar{font-size:46px;line-height:1;width:72px;height:72px;display:grid;place-items:center;background:var(--panel-2);border-radius:16px;border:1px solid var(--line)}
.req{font-size:16px;border-left:3px solid var(--accent);padding-left:10px}
.conds{margin:0;padding-left:20px;display:grid;gap:2px}
.lock{border:1px dashed var(--alert);color:var(--alert);background:#fff;border-radius:10px;padding:6px 12px;font-size:14px;font-weight:600}
.leak{border:1px solid var(--alert);background:#fbeceb;border-radius:10px;padding:8px 12px;font-size:14px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:760px){.slots{grid-template-columns:repeat(2,1fr)}}
.slot{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px;min-width:0;position:relative}
.slot.full{border-style:solid}
.slot.full.sight{border-color:var(--sight)} .slot.full.food{border-color:var(--food)}
.slot .sl{font-size:12px;font-weight:700;color:var(--muted)}
.slot .pn{font-family:var(--f-display);font-size:19px;line-height:1.2;background:none;border:0;padding:0;text-align:left}
.slot .x{position:absolute;right:6px;top:4px;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:4px}
.sumbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.sumbar .nums{display:flex;flex-wrap:wrap;gap:6px 18px}
.over{color:var(--alert);font-weight:700}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 14px;font-weight:600;font-size:14px}
.tab[aria-selected="true"]{background:var(--text);color:#fff;border-color:var(--text)}
canvas.map{width:100%;aspect-ratio:960/600;display:block;border-radius:10px;border:1px solid var(--line);cursor:pointer;background:#eee}
.legend{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--panel-2)}
tbody tr.pick{cursor:pointer}
tbody tr.pick:hover,tbody tr.sel{background:#fbf1e3}
.detail h3{font-size:24px}
.stat{display:grid;gap:4px}
.stat .k{font-size:12px;font-weight:700;color:var(--muted)}
.ci{position:relative;height:14px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line)}
.ci i{position:absolute;top:2px;bottom:2px;border-radius:5px;background:rgba(47,111,184,.35)}
.ci b{position:absolute;top:-3px;width:4px;height:18px;border-radius:2px;background:var(--sight);transform:translateX(-2px)}
.ci-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:44px 1fr 36px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:12px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--sight)}
.bar .t i.hot{background:var(--alert)}
.wx td,.wx th{text-align:center}
.wx .hi{color:var(--alert);font-weight:700}

/* 여행 시뮬레이션 */
.diary{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.diary li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.diary .when{font-size:12px;font-weight:700;color:var(--muted)}

/* 결과 */
.review{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.review .avatar{font-size:52px}
.stars{color:#e0a100;font-size:22px;letter-spacing:2px}
.score{font-family:var(--f-mono);font-size:40px;font-weight:600;line-height:1}
.ok{color:var(--ok);font-weight:700} .no{color:var(--alert);font-weight:700}
td.why{white-space:normal;min-width:220px}
.goals{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.goals li{display:flex;gap:8px;align-items:baseline}
.dik{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:700px){.dik{grid-template-columns:1fr}}
.dik div{background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:14px}
.dik b{display:block;font-family:var(--f-display);font-size:18px;font-weight:400}
textarea{width:100%;min-height:76px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}

/* 팝업 */
.pmodal{position:fixed;inset:0;z-index:50;background:rgba(30,24,16,.55);display:grid;place-items:center;padding:16px}
.pmodal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.rv{border-bottom:1px solid var(--line);padding:6px 0;display:grid;gap:2px;font-size:14px}
.rv .m{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
</style>

<main class="wrap">

<!-- 처음 화면 -->
<section id="sc-title" class="card title">
  <p class="kicker">통합과학2 · 빅데이터 활용</p>
  <h1>데이터 <em>여행사</em></h1>
  <p class="muted">의뢰인에게 딱 맞는 하루 여행을 데이터로 설계하세요.</p>
  <div class="steps4">
    <div><b>① 의뢰서</b>의뢰인의 조건 읽기</div>
    <div><b>② 데이터 탐색</b>평점·리뷰·혼잡도·날씨</div>
    <div><b>③ 일정 짜기</b>오전·점심·오후·저녁</div>
    <div><b>④ 여행 후기</b>의뢰인이 매긴 점수</div>
  </div>
  <label class="row" style="justify-content:center">
    <span>플래너 이름</span>
    <input id="nm" maxlength="12" placeholder="예: 정유진" autocomplete="off">
  </label>
  <button class="btn" id="go">여행사 출근하기</button>
</section>

<!-- 이야기 -->
<section id="sc-intro" class="card" hidden>
  <p class="eyebrow">첫 출근</p>
  <div id="intro" style="display:grid;gap:10px"></div>
  <div class="row"><button class="btn ghost" id="skip-intro">건너뛰기 ⏭</button><button class="btn" id="go2">첫 의뢰 받기</button></div>
</section>

<!-- 계획 -->
<section id="sc-plan" hidden style="display:grid;gap:16px">
  <div class="card client" id="client"></div>
  <div class="slots" id="slots"></div>
  <div class="card" style="gap:8px">
    <div class="sumbar">
      <div class="nums" id="nums"></div>
      <div class="row">
        <button class="btn ghost small" id="ai">🤖 AI 추천 코스 받기</button>
        <button class="btn" id="send" disabled>✈ 여행 보내기</button>
      </div>
    </div>
    <p class="tip" id="tip"></p>
  </div>
  <div class="grid2">
    <div class="card">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="map" aria-selected="true">🗺 지도</button>
        <button class="tab" role="tab" data-tab="table" aria-selected="false">📋 장소 데이터 표</button>
        <button class="tab" role="tab" data-tab="weather" aria-selected="false">🌦 날씨 데이터</button>
      </div>
      <div id="tab-map" style="display:grid;gap:8px">
        <canvas class="map" id="map" width="960" height="600" tabindex="0" aria-label="가람시 지도. 장소를 누르면 데이터를 볼 수 있어요. 장소 데이터 표에서도 고를 수 있어요."></canvas>
        <div class="legend"><span><i class="dot" style="background:var(--sight)"></i>관광지</span><span><i class="dot" style="background:var(--food)"></i>식당</span><span>⬤ 가람역 = 출발·도착</span><span>점선 = 내 여행 경로</span></div>
      </div>
      <div id="tab-table" hidden style="display:grid;gap:8px">
        <label class="row" style="font-size:14px">정렬
          <select id="sort"><option value="">기본</option><option value="rating">평점 높은 순</option><option value="reviews">리뷰 많은 순</option><option value="price">가격 낮은 순</option></select>
        </label>
        <div class="tablebox"><table><thead><tr><th>장소</th><th>종류</th><th>동네</th><th>평점</th><th>리뷰 수</th><th>실내·실외</th><th>계단</th><th>1인 가격</th></tr></thead><tbody id="tbody"></tbody></table></div>
        <p class="muted" style="font-size:13px">줄을 누르면 오른쪽에 자세한 데이터가 나와요.</p>
      </div>
      <div id="tab-weather" hidden style="display:grid;gap:8px"></div>
    </div>
    <div class="card detail" id="detail"></div>
  </div>
</section>

<!-- 여행 -->
<section id="sc-sim" hidden class="card">
  <div class="row" style="justify-content:space-between">
    <h2 id="sim-h">여행 중…</h2>
    <button class="btn ghost small" id="skip">건너뛰기</button>
  </div>
  <div class="grid2">
    <canvas class="map" id="simc" width="960" height="600" style="cursor:default" aria-hidden="true"></canvas>
    <div style="display:grid;gap:10px;align-content:start">
      <h3>여행 일기</h3>
      <ul class="diary" id="diary" aria-live="polite"></ul>
      <button class="btn" id="to-res" hidden>후기 보기</button>
    </div>
  </div>
</section>

<!-- 결과 -->
<section id="sc-result" hidden style="display:grid;gap:16px"></section>

<!-- 최종 보고서 -->
<section id="sc-final" hidden style="display:grid;gap:16px"></section>

</main>

<div class="pmodal" id="modal" hidden><div class="card" id="mcard" role="dialog" aria-modal="true"></div></div>

<script>
/* ================= 수업 내용: 이 아래 STORY, PLACES, CLIENTS만 고치면 됩니다 ================= */

const STORY = {
  intro: [
    '어서 와요, {name} 플래너님! 저는 데이터 여행사의 AI 파트너 나래예요.',
    '우리 여행사는 감이 아니라 데이터로 여행을 짜요. 리뷰, 방문자 수로 만든 혼잡도, 기상청 예보 같은 데이터가 가람시 곳곳에서 쌓이고 있거든요.',
    '의뢰인마다 조건이 달라요. 무릎이 아픈 할머니, 어린아이가 있는 가족, 비건 여행자…. 옷을 TPO에 맞춰 입듯, 여행도 사람과 날씨와 시간에 맞춰야 해요.',
    '오전·점심·오후·저녁 네 칸을 채우면 의뢰인이 실제로 여행을 다녀와서 점수를 매겨요. 평점이 높다고 무조건 좋은 곳은 아니니까, 데이터를 꼼꼼히 보세요!'
  ],
  final: '데이터가 많을수록 더 좋은 여행을 짤 수 있었어요. 하지만 검증되지 않은 리뷰, 동의 없는 개인정보, 순위만 믿는 습관은 오히려 여행을 망쳤죠. 빅데이터는 잘 쓰면 힘이 되고, 함부로 쓰면 문제가 돼요.'
};

/* 장소 데이터 (가상). x·y = 지도 칸(가로 24 × 세로 15), crowd = 혼잡도 0~100
   관광지 crowd: [오전, 오후] / 식당 crowd: [점심, 저녁], stairs: 0 평지 1 조금 2 많음
   fake: 리뷰 수가 적고 같은 날 몰린 광고성 리뷰 (검증 함정) */
const PLACES = [
  {id:'s1',type:'sight',name:'가람 역사박물관',dong:'하늘동',x:8,y:5,indoor:true,stairs:0,price:0,rating:4.4,reviews:1240,crowd:[30,55],tags:['역사','아이'],desc:'가람시 2천 년 역사를 보여 주는 박물관. 엘리베이터가 있어요.'},
  {id:'s2',type:'sight',name:'산마루 성곽길',dong:'산마루동',x:20,y:2.5,indoor:false,stairs:2,price:0,rating:4.7,reviews:2380,crowd:[40,60],tags:['역사','경치','사진'],desc:'옛 성벽을 따라 걷는 산길. 경치가 좋지만 돌계단이 이어져요.'},
  {id:'s3',type:'sight',name:'강변 생태공원',dong:'강변동',x:4.5,y:10,indoor:false,stairs:0,price:0,rating:4.3,reviews:980,crowd:[25,45],tags:['자연','아이','산책'],desc:'강을 따라 평평한 산책로와 놀이터가 있는 공원.'},
  {id:'s4',type:'sight',name:'바다 해양과학관',dong:'바다동',x:19,y:12,indoor:true,stairs:0,price:8000,rating:4.5,reviews:1650,crowd:[45,90],tags:['바다','아이','체험'],desc:'바다 생물 수조와 체험관이 있는 실내 과학관.'},
  {id:'s5',type:'sight',name:'하늘 전망대',dong:'하늘동',x:3.5,y:2.8,indoor:true,stairs:1,price:12000,rating:4.6,reviews:3100,crowd:[20,60],tags:['경치','사진'],desc:'도시가 한눈에 보이는 실내 전망대. 엘리베이터에서 내려 계단을 조금 올라요.'},
  {id:'s6',type:'sight',name:'갯벌 체험장',dong:'바다동',x:22,y:13.6,indoor:false,stairs:0,price:10000,rating:4.2,reviews:420,crowd:[30,50],tags:['바다','아이','체험'],desc:'장화를 신고 갯벌 생물을 관찰하는 야외 체험장.'},

const SLOTS=[{name:'오전',kind:'sight',label:'관광'},{name:'점심',kind:'food',label:'식사'},{name:'오후',kind:'sight',label:'관광'},{name:'저녁',kind:'food',label:'식사'}];
const STAIRS=['평지','계단 조금','계단 많음'];
const STATION={x:12,y:7.5,name:'가람역'};
const CELL=40, KM_PER_CELL=0.25;
const CRIT_MAX={weather:20,move:15,diet:15,budget:15,crowd:10,interest:15,verify:10};
const BY=Object.fromEntries(PLACES.map(p=>[p.id,p]));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>n.toLocaleString('ko-KR')+'원';
const crowdOf=(p,slot)=>p.crowd[slot<2?0:1];

const S={name:'',ci:0,plan:[null,null,null,null],sel:null,priv:[],aiPicks:[],results:[],notes:[],tab:'map',sort:''};

function show(id){
  document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!==id);
  scrollTo(0,0);
}

function routeKm(P){
  const pts=[STATION,...P.filter(Boolean),STATION];
  let d=0; for(let i=1;i<pts.length;i++) d+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
  return Math.round(d*KM_PER_CELL*10)/10;
}

/* 여행 평가: 항목별 점수와 장소별 여행 일기 */
function evaluate(c,plan){
  const P=plan.map(id=>BY[id]), notes=P.map(()=>[]), crit=[];
  const add=(key,name,ok,why)=>crit.push({key,name,ok,why,max:CRIT_MAX[key],pts:ok?CRIT_MAX[key]:0});
  const bad=i=>c.weather[i].rain>=60?'rain':c.weather[i].feel>=33?'heat':null;

  const wf=[];
  P.forEach((p,i)=>{const b=bad(i); if(!p.indoor&&b){
    wf.push(`${SLOTS[i].name} ${p.name}: ${b==='rain'?'강수확률 '+c.weather[i].rain+'%':'체감온도 '+c.weather[i].feel+'℃'}인데 실외`);
    notes[i].push(b==='rain'?'☔ 비가 쏟아져서 흠뻑 젖었어요.':'🥵 너무 더워서 모두 지쳤어요.');}});
  // 통과 문구는 실제로 고른 장소를 그대로 말해야 함 (실외를 골랐는데 "실내를 골랐다"고 하지 않게)
  const badSlots=SLOTS.filter((s,i)=>bad(i)).map(s=>s.name), outGood=P.filter((p,i)=>!p.indoor&&!bad(i)).map(p=>p.name);
  add('weather','날씨',!wf.length,wf.join(' / ')||[
    badSlots.length?`비·폭염인 ${badSlots.join('·')}에는 실내 장소를 골랐어요.`:'날씨가 나쁜 시간대가 없었어요.',
    outGood.length?`실외 장소(${outGood.join(', ')})는 날씨가 괜찮은 시간에 갔어요.`:''].join(' ').trim());

  const mf=[];
  P.forEach((p,i)=>{if(p.stairs>c.maxStairs){mf.push(`${p.name}: ${STAIRS[p.stairs]}`);notes[i].push('😣 계단이 많아서 너무 힘들었어요.');}});
  const km=routeKm(P);
  if(km>c.maxKm) mf.push(`이동 거리 ${km} km (한도 ${c.maxKm} km)`);
  add('move','이동',!mf.length,mf.join(' / ')||`이동 거리 ${km} km, 계단 조건도 지켰어요.`);

  const df=[];
  [1,3].forEach(i=>{const p=P[i];
    const ok=(!c.diet.need||p.tags.includes(c.diet.need))&&(!c.diet.avoid||!p.tags.includes(c.diet.avoid));
    if(!ok){df.push(`${SLOTS[i].name} ${p.name}`);notes[i].push('🍽️ '+c.diet.msg);}});
  add('diet','식사',!df.length,df.length?`${df.join(', ')}: ${c.diet.label} 조건에 맞지 않아요.`:`두 끼 모두 ${c.diet.label} 조건에 맞아요.`);

  const cost=P.reduce((s,p)=>s+p.price*c.people,0);
  add('budget','예산',cost<=c.budget,`${won(cost)} / 예산 ${won(c.budget)}`);

  const cf=[];
  P.forEach((p,i)=>{const v=crowdOf(p,i); if(v>=80){cf.push(`${SLOTS[i].name} ${p.name}: 혼잡도 ${v}`);notes[i].push('😵 사람이 너무 많아 한참 줄을 섰어요.');}});
  add('crowd','혼잡',!cf.length,cf.join(' / ')||'붐비는 시간대(혼잡도 80 이상)를 피했어요.');

  const ir=c.interest.map(q=>{const pool=q.slot!=null?[P[q.slot]]:P;
    return {label:q.label,ok:pool.filter(p=>p.tags.some(t=>q.tags.includes(t))).length>=(q.min||1)};});
  add('interest','취향',ir.every(r=>r.ok),ir.map(r=>(r.ok?'✔ ':'✘ ')+r.label).join(' / '));

  P.forEach((p,i)=>{if(p.fake) notes[i].push('😑 사진과 완전히 달라요. 리뷰를 믿었는데….');});
  const ff=P.filter(p=>p.fake);
  add('verify','검증',!ff.length,ff.map(p=>`${p.name}: 리뷰 ${p.reviews}개가 모두 같은 날 올라온 광고성 리뷰`).join(' / ')||'검증되지 않은 장소는 고르지 않았어요.');

  P.forEach((p,i)=>{if(!notes[i].length) notes[i].push(p.tags.some(t=>c.interest.some(q=>q.tags.includes(t)))?'😊 정말 좋았어요!':p.type==='food'?'😋 맛있게 잘 먹었어요.':'🙂 무난했어요.');});
  return {crit,notes,cost,km,fake:ff.length>0,score:crit.reduce((s,k)=>s+k.pts,0)};
}

/* AI 추천: 의뢰인 조건은 보지 않고 평점 순으로만 고름 (지나친 데이터 의존 체험) */
function aiPlan(){
  const top=t=>PLACES.filter(p=>p.type===t).sort((a,b)=>b.rating-a.rating);
  const s=top('sight'), f=top('food');
  return [s[0].id,f[0].id,s[1].id,f[1].id];
}

  ctx.strokeStyle='#a9cfea';ctx.lineWidth=24;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-10,470);ctx.bezierCurveTo(160,440,300,560,470,520);ctx.bezierCurveTo(560,500,640,580,720,620);ctx.stroke();
  ctx.fillStyle='#a9d3ec';ctx.beginPath();ctx.moveTo(740,600);ctx.quadraticCurveTo(880,575,960,505);ctx.lineTo(960,600);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=14;
  [[0,300,960,300],[480,0,480,600],[480,300,160,110],[480,300,820,140],[480,300,220,560],[480,300,840,520]]
    .forEach(([a,b,c,d])=>{ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();});
  ctx.fillStyle='rgba(42,36,28,.32)';ctx.font='26px "Do Hyeon","Malgun Gothic",sans-serif';ctx.textAlign='left';ctx.textBaseline='alphabetic';
  [['하늘동',16,36],['산마루동',496,36],['강변동',16,336],['바다동',496,336]].forEach(([n,x,y])=>ctx.fillText(n,x,y));

  const route=(o.route||[]).map(id=>id&&BY[id]);

  if(pts.length>2){
    ctx.strokeStyle='rgba(201,80,42,.85)';ctx.lineWidth=4;ctx.setLineDash([10,8]);
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x*CELL,p.y*CELL):ctx.moveTo(p.x*CELL,p.y*CELL));ctx.stroke();ctx.setLineDash([]);
  }
  // 가람역

  label(ctx,'가람역 (출발·도착)',STATION.x*CELL,STATION.y*CELL+30,'#2a241c',true);

  PLACES.forEach((p,i)=>{
    const x=p.x*CELL,y=p.y*CELL,col=p.type==='sight'?'#2f6fb8':'#c9502a';
    if(o.sel===p.id){ctx.strokeStyle=col;ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,22,0,7);ctx.stroke();}
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,14,0,7);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='600 13px "IBM Plex Mono",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(i+1),x,y+1);
    const slot=route.findIndex(r=>r&&r.id===p.id);
    if(slot>=0){ctx.fillStyle='#fff';ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+15,y-15,10,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle=col;ctx.font='700 12px "IBM Plex Sans KR",sans-serif';ctx.fillText(SLOTS[slot].name[0],x+15,y-14);}
    label(ctx,p.name,x,y+26,'#2a241c',o.sel===p.id);
  });
  if(o.fx==='rain'){ctx.strokeStyle='rgba(60,110,170,.45)';ctx.lineWidth=2;const t=o.t||0;
    for(let i=0;i<140;i++){const x=(i*73+t*0.6)%980-10,y=(i*131+t*1.4)%620-10;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-6,y+16);ctx.stroke();}
    ctx.fillStyle='rgba(70,90,120,.12)';ctx.fillRect(0,0,960,600);}
  if(o.fx==='heat'){ctx.fillStyle='rgba(255,120,40,.18)';ctx.fillRect(0,0,960,600);}
  if(o.agent){const a=o.agent;ctx.fillStyle='#fff';ctx.strokeStyle='#c9502a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(a.x,a.y,20,0,7);ctx.fill();ctx.stroke();
    ctx.font='24px "Segoe UI Emoji","Apple Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(a.emoji,a.x,a.y+1);}
  if(o.caption){ctx.font='22px "Do Hyeon","Malgun Gothic",sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
    const w=ctx.measureText(o.caption).width+24;ctx.fillStyle='rgba(42,36,28,.85)';ctx.fillRect(12,12,w,36);ctx.fillStyle='#fff';ctx.fillText(o.caption,24,18);}
}
function label(ctx,t,x,y,col,bold){

  ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y);

/* ---------- 리뷰 원자료 (같은 장소는 항상 같은 리뷰) ---------- */
function rng(seed){let s=seed;return()=>(s=(s*9301+49297)%233280)/233280;}
const POOL={
  sight:['생각보다 볼거리가 많았어요.','주차가 조금 불편했어요.','아이들이 좋아했어요.','사람 많을 땐 오전에 가세요.','설명이 잘 되어 있어요.','사진 찍기 좋아요.','한 번쯤 가 볼 만해요.','기대보다는 평범했어요.'],
  food:['양이 넉넉해요.','점심엔 줄이 길어요.','직원분들이 친절해요.','가격 대비 괜찮아요.','맛이 깔끔해요.','조금 짰어요.','또 오고 싶어요.','메뉴가 다양해요.'],
  fake:['여기 진짜 최고예요!! 강추👍👍','인생샷 무조건 여기!! 강추👍','#협찬 #광고 분위기 최고 강추👍','완전 최고!! 무조건 가세요 강추👍','친구가 사장님인데 진짜 좋아요 강추👍','사진 맛집!! 최고예요 강추👍']
};
function reviewsOf(p){
  const r=rng([...p.id].reduce((s,c)=>s*31+c.charCodeAt(0),7)%233280);
  return Array.from({length:6},(_,i)=>{
    if(p.fake) return {d:'2026.10.12',star:5,t:POOL.fake[i]};
    const y=2024+Math.floor(r()*3),m=1+Math.floor(r()*12),d=1+Math.floor(r()*28);
    const star=Math.max(1,Math.min(5,Math.round(p.rating+(r()-.5)*2.2)));
    return {d:`${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')}`,star,t:POOL[p.type][Math.floor(r()*8)]};
  }).sort((a,b)=>b.d.localeCompare(a.d));
}

const TYPE_MS=22;
function typeText(el,text,instant){
  finishType(el);
  return new Promise(res=>{
    let id=0,i=0;
    const done=()=>{clearInterval(id);el.textContent=text;el._fin=null;el.closest('.typing')?.classList.remove('typing');res();};
    if(instant) return done();
    el.textContent='';el._fin=done;
    id=setInterval(()=>{el.textContent=text.slice(0,++i);if(i>=text.length)done();},TYPE_MS);
  });
}
function finishType(el){el&&el._fin&&el._fin();}

/* ---------- 여행 시뮬레이션 ---------- */
let simCtx, simRaf=0, simEnd=null;
function runSim(){
  const c=CLIENTS[S.ci], ev=evaluate(c,S.plan), P=S.plan.map(id=>BY[id]);
  S.last=ev; show('sc-sim');
  $('#sim-h').textContent=`${c.name}의 여행`;
  $('#diary').innerHTML='';$('#to-res').hidden=true;$('#skip').hidden=false;
  const pts=[STATION,...P,STATION].map(p=>({x:p.x*CELL,y:p.y*CELL}));
  const fxOf=i=>i<4?(c.weather[i].rain>=60?'rain':c.weather[i].feel>=33?'heat':null):null;
  let leg=0, t0=performance.now(), pause=0, logged=-1;
  const addEntry=i=>{const p=P[i];const li=document.createElement('li');
    li.innerHTML=`<span class="when">${SLOTS[i].name} · ${c.weather[i].sky} · ${p.name}</span><br>${ev.notes[i].join('<br>')}`;$('#diary').appendChild(li);logged=i;};
  const finish=()=>{cancelAnimationFrame(simRaf);for(let i=logged+1;i<4;i++)addEntry(i);
    drawMap(simCtx,{route:S.plan,agent:{...pts[5],emoji:c.emoji},caption:'여행 끝! 가람역 도착'});
    $('#skip').hidden=true;$('#to-res').hidden=false;$('#to-res').focus();};
  simEnd=finish;
  const step=now=>{
    const a=pts[leg],b=pts[leg+1],len=Math.hypot(b.x-a.x,b.y-a.y),dur=Math.max(600,len/280*1000);
    let k=(now-t0)/dur;
    if(pause){k=1;if(now>=pause){pause=0;leg++;t0=now;if(leg>=pts.length-1)return finish();}}
    else if(k>=1){k=1;if(leg<4){addEntry(leg);pause=now+1500;}else{leg++;}
      if(leg>=pts.length-1)return finish();}
    const slot=Math.min(leg,3);
    drawMap(simCtx,{route:S.plan,agent:{x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k,emoji:c.emoji},fx:fxOf(slot),t:now/16,caption:`${SLOTS[slot].name} · ${c.weather[slot].sky}`});
    simRaf=requestAnimationFrame(step);
  };
  simRaf=requestAnimationFrame(step);
}

        <p class="eyebrow">의뢰인 후기</p>
        <h2>${c.name}</h2>
        <span class="stars" aria-label="만족도 별 ${sat}개">${'★'.repeat(sat)}${'☆'.repeat(5-sat)}</span>
        <p style="font-size:17px">${q}</p>
        ${priv?`<p class="leak">"그런데… 제 개인적인 이야기는 어떻게 아셨어요? 좀 불쾌하네요." <span class="muted">(동의 없이 본 정보: ${c.privacy.title})</span></p>`:''}
      </div>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between"><h3>만족도 점수</h3><span class="score">${ev.score}<span class="muted" style="font-size:18px"> / 100</span></span></div>
      <div class="tablebox"><table><thead><tr><th>항목</th><th>결과</th><th>점수</th><th>까닭</th></tr></thead><tbody>
        ${ev.crit.map(k=>`<tr><td><b>${k.name}</b></td><td class="${k.ok?'ok':'no'}">${k.ok?'✔':'✘'}</td><td class="mono">${k.pts}/${k.max}</td><td class="why">${esc(k.why)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="muted" style="font-size:13px">이동 ${ev.km} km · 비용 ${won(ev.cost)}${usedAI()?' · 🤖 AI 추천 코스를 썼어요':''}</p>
    </div>
    <div class="card">
      <h3>플래너 별점 ${'★'.repeat(st.filter(Boolean).length)}${'☆'.repeat(3-st.filter(Boolean).length)}</h3>
      <ul class="goals">
        <li><span class="${st[0]?'ok':'no'}">${st[0]?'★':'☆'}</span> 필수 조건(날씨·이동·식사·예산)을 모두 지킴</li>
        <li><span class="${st[1]?'ok':'no'}">${st[1]?'★':'☆'}</span> 만족도 80점 이상</li>
        <li><span class="${st[2]?'ok':'no'}">${st[2]?'★':'☆'}</span> 동의 없는 개인정보를 보지 않고, 검증되지 않은 장소를 고르지 않음</li>
      </ul>
      ${usedAI()?`<p class="tip warn">🤖 나래: 제 추천은 <b>평점 순서</b>로만 골랐어요. 의뢰인의 조건은 보지 않았죠. 데이터와 AI를 지나치게 믿으면 이렇게 될 수 있어요.</p>`:''}
    </div>
    <div class="card">
      <h3>데이터 → 정보 → 지식</h3>
      <div class="dik">
        <div><b>데이터</b>${c.concept.data}</div>
        <div><b>정보</b>${c.concept.info}</div>
        <div><b>지식</b>${c.concept.know}</div>
      </div>
    </div>
    <div class="card">
      <h3>생각해 보기</h3>
      <p>${c.think}</p>
      <textarea id="note" placeholder="${c.notePh}" aria-label="생각해 보기 답 쓰기">${esc(S.notes[S.ci]||'')}</textarea>
      <div class="row">
        <button class="btn ghost" id="retry">같은 의뢰 다시 짜기</button>
        <button class="btn" id="next">${last?'최종 보고서 보기':'다음 의뢰 받기'}</button>
      </div>
    </div>`;
  show('sc-result');
  $('#note').oninput=e=>S.notes[S.ci]=e.target.value;
  $('#retry').onclick=()=>{const keep=S.plan,ai=S.aiPicks[S.ci];startClient(S.ci);S.plan=[...keep];S.aiPicks[S.ci]=ai;renderPlan();setTip('후기에서 ✘가 나온 항목을 데이터에서 다시 확인해 보세요.');};
  $('#next').onclick=()=>last?renderFinal():startClient(S.ci+1);
}

/* ---------- 최종 보고서 ---------- */
function reportText(){
  return [`[데이터 여행사 보고서] 플래너: ${S.name}`,
    ...CLIENTS.map((c,i)=>{const r=S.results[i]||{};return `${i+1}. ${c.name}: ${r.score??'-'}점, 별 ${r.stars??0}개\n  질문: ${c.think}\n  내 생각: ${S.notes[i]||'(없음)'}`;})].join('\n');
}
function renderFinal(){
  const tot=S.results.reduce((s,r)=>s+(r?r.stars:0),0);
  $('#sc-final').innerHTML=`
    <div class="card">
      <p class="eyebrow">최종 보고서</p>
      <h2>${esc(S.name)} 플래너의 기록 · 별 ${tot} / ${CLIENTS.length*3}</h2>
      <div class="tablebox"><table><thead><tr><th>의뢰인</th><th>만족도</th><th>별점</th><th>개인정보</th><th>AI 추천</th></tr></thead><tbody>
        ${CLIENTS.map((c,i)=>{const r=S.results[i]||{};return `<tr><td>${c.emoji} ${c.name}</td><td class="mono">${r.score??'-'}</td><td>${'★'.repeat(r.stars||0)}${'☆'.repeat(3-(r.stars||0))}</td><td>${r.priv?'<span class="no">열어 봄</span>':'<span class="ok">지킴</span>'}</td><td>${r.ai?'사용':'-'}</td></tr>`;}).join('')}
      </tbody></table></div>
    </div>
    <div class="card talk"><div class="face" aria-hidden="true">🤖</div><div class="bubble typing" id="final-talk" title="누르면 바로 보기"><div class="who">나래</div><span></span></div></div>
    <div class="card">
      <h3>빅데이터, 이렇게 겪었어요</h3>
      <div class="dik">
        <div><b>장점</b>날씨·혼잡도·리뷰 데이터로 의뢰인에게 맞는 여행을 빠르고 정확하게 예측했어요.</div>
        <div><b>문제점</b>광고성 리뷰(검증되지 않은 데이터), 동의 없는 개인정보(사생활 침해), 평점 순 AI 추천(지나친 의존).</div>
        <div><b>활용 분야</b>관광 정책, 교통, 기상 관측, 과학 연구, 신약 개발…. 다른 분야에서는 어떻게 쓰일까요?</div>
      </div>
    </div>
    <div class="card">
      <h3>나의 생각 모음</h3>
      ${CLIENTS.map((c,i)=>`<div><p class="muted" style="font-size:13px">${i+1}. ${c.think}</p><p>${esc(S.notes[i]||'(쓰지 않음)')}</p></div>`).join('')}
      <div class="row"><button class="btn" id="copy">내 기록 복사하기</button><span id="copied" class="ok" aria-live="polite"></span><button class="btn ghost" id="home">처음 화면으로</button></div>
    </div>`;
  show('sc-final');
  const ft=$('#final-talk span'); $('#final-talk').onclick=()=>finishType(ft); typeText(ft,STORY.final);
  $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(reportText());$('#copied').textContent='복사했어요!';}
    catch{openModal(`<h3>아래 글을 복사하세요</h3><textarea style="min-height:200px">${esc(reportText())}</textarea><div class="row"><button class="btn" id="mc">닫기</button></div>`,close=>$('#mc').onclick=close);}};
  $('#home').onclick=()=>openModal(`<h3>정말 처음 화면으로 가시겠습니까?</h3><p>지금까지의 기록이 사라져요.</p>
    <div class="row"><button class="btn" data-focus id="hn">머물게요</button><button class="btn ghost" id="hy">처음으로</button></div>`,
    close=>{$('#hn').onclick=close;$('#hy').onclick=()=>{close();location.reload();};});
}

/* ---------- 시작 ---------- */
mapCtx=setupCanvas($('#map')); simCtx=setupCanvas($('#simc'));
let skipIntro=false;
$('#go').onclick=async()=>{
  S.name=$('#nm').value.trim()||'정유진';
  $('#intro').innerHTML='';skipIntro=false;$('#skip-intro').hidden=false;
  show('sc-intro');$('#skip-intro').focus();
  for(const t of STORY.intro){
    const d=document.createElement('div');d.className='talk';
    d.innerHTML='<div class="face" aria-hidden="true">🤖</div><div class="bubble typing"><div class="who">나래</div><span></span></div>';
    $('#intro').appendChild(d);
    const sp=d.querySelector('span');
    d.querySelector('.bubble').onclick=()=>finishType(sp);
    await typeText(sp,t.replace('{name}',S.name),skipIntro);
  }
  $('#skip-intro').hidden=true;$('#go2').focus();
};
$('#skip-intro').onclick=()=>{skipIntro=true;document.querySelectorAll('#intro span').forEach(finishType);};
$('#nm').onkeydown=e=>{if(e.key==='Enter')$('#go').click();};
$('#go2').onclick=()=>startClient(0);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));
  ['map','table','weather'].forEach(t=>$('#tab-'+t).hidden=t!==b.dataset.tab);
});
$('#sort').onchange=e=>{S.sort=e.target.value;renderTable();};
$('#tip').onclick=()=>finishType($('#tip'));
$('#map').onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*960, y=(e.clientY-r.top)/r.height*600;
  let best=null,bd=28; PLACES.forEach(p=>{const d=Math.hypot(p.x*CELL-x,p.y*CELL-y);if(d<bd){bd=d;best=p;}});
  if(best) select(best.id);
};
$('#ai').onclick=()=>{S.aiPicks[S.ci]=aiPlan();S.plan=[...S.aiPicks[S.ci]];renderPlan();
  setTip('평점이 가장 높은 곳으로 골랐어요! …그런데 의뢰인 조건은 따로 확인하지 않았어요.',true);};
$('#send').onclick=runSim;
$('#skip').onclick=()=>simEnd&&simEnd();
$('#to-res').onclick=renderResult;

/* 자가 점검: 모범 코스는 100점, AI 추천 코스는 60점 미만이어야 함 */
CLIENTS.forEach(c=>{
  const a=evaluate(c,c.ideal), b=evaluate(c,aiPlan());
  console.assert(a.score===100,`[점검] ${c.name} 모범 코스 ${a.score}점`,a.crit.filter(k=>!k.ok));
  console.assert(b.score<60,`[점검] ${c.name} AI 추천 ${b.score}점`);
});
</script>
</html>
